name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Lint, manifest check and tests
        run: npm run verify
      - name: Release name
        run: |
          name=$(jq -r --arg v "$GITHUB_REF_NAME" '.releases[] | select(.version == $v) | .name' releases.json)
          if [ -z "$name" ]; then
            echo "::error::add $GITHUB_REF_NAME to releases.json"
            exit 1
          fi
          echo "RELEASE_TITLE=$GITHUB_REF_NAME $name" >> "$GITHUB_ENV"
      - name: Zip every item
        run: |
          mkdir -p dist
          root="$PWD"
          jq -r '.items[] | [.path, .zip] | @tsv' library.json | while IFS=$'\t' read -r path zip; do
            (cd "$(dirname "$path")" && zip -qr "$root/dist/$zip" "$(basename "$path")" -x '*/evals/results/*')
          done
          # An item's files outside its own path go in its zip too, under their path below the top folder: an agent's
          # agents/codex/<slug>.toml and agents/antigravity/<slug>.md land as codex/<slug>.toml and antigravity/<slug>.md.
          jq -r '.items[] | .path as $p | .zip as $z | .files[] | select(. != $p and (startswith($p + "/") | not)) | [$z, .] | @tsv' library.json | while IFS=$'\t' read -r zip file; do
            (cd "${file%%/*}" && zip -q "$root/dist/$zip" "${file#*/}")
          done
          cp library.json dist/library.json
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$RELEASE_TITLE" --generate-notes
