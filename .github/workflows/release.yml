name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Lint, manifest check and tests
        run: npm run verify
      - name: Zip every item
        run: |
          mkdir -p dist
          root="$PWD"
          jq -r '.items[] | [.path, .zip] | @tsv' library.json | while IFS=$'\t' read -r path zip; do
            (cd "$(dirname "$path")" && zip -qr "$root/dist/$zip" "$(basename "$path")" -x '*/evals/results/*')
          done
          cp library.json dist/library.json
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
