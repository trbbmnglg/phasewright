name: Board sync

# Keeps the GitHub Project "phasewright" in step with what ships. A commit message
# with `Ships #N`, `Fixes #N` or `Opens #N` (plus `Hours:` and `Deploy:` lines)
# updates those issues and their Project cards. See scripts/board-sync.mjs.
#
# Needs the repo secret BOARD_TOKEN: a classic personal access token with only
# the `project` and `repo` scopes (the token GitHub gives an Action can't edit a
# personal Project). Without it the job does nothing and says so.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: "Test: a commit message to read (e.g. 'Ships #17')"
        required: false
      dry_run:
        description: "Dry run: write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Read the commit messages and update the board
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          TEST_MESSAGE: ${{ inputs.message }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::BOARD_TOKEN is not set, so the board was not updated."
            exit 0
          fi
          flags=""
          if [ "$DRY" = "true" ]; then flags="--dry-run"; fi
          if [ -n "$TEST_MESSAGE" ]; then
            node scripts/board-sync.mjs $flags --sha "$GITHUB_SHA" --message "$TEST_MESSAGE"
          else
            node scripts/board-sync.mjs $flags
          fi
